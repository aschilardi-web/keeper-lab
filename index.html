function getCumul(rows,id){let ok=0,t=0;const pm=[];rows.forEach(r=>{const o2=r[id+'_ok']||0,t2=r[id+'_total']||0;ok+=o2;t+=t2;pm.push({ok:o2,t:t2});});return{ok,total:t,perMatch:pm};}
function getTotalMin(rows){return rows.reduce((a,r)=>a+(r.minutes_played||0),0);}
function getCleanSheets(rows){return rows.filter(r=>r.clean_sheet).length;}

// DATA HOOK
// ============================================================
function useData(){
  const [journal,setJ]=useState([]);
  const [stats,setS]=useState([]);
  const [mobility,setM]=useState([]);
  const [msgs,setC]=useState([]);
  const [mission,setMi]=useState({});
  const [activities,setA]=useState([]);
  const [loading,setL]=useState(true);
  const [err,setErr]=useState(null);

  const load=useCallback(async()=>{
    try{
      const j=await sb.from('journal').select('*').order('created_at',{ascending:false});
      const s=await sb.from('match_stats').select('*').order('created_at',{ascending:true});
      const m=await sb.from('mobility').select('*').order('date',{ascending:true});
      const c=await sb.from('coach_messages').select('*').order('created_at',{ascending:false});
      setJ(j.data||[]);setS(s.data||[]);setM(m.data||[]);setC(c.data||[]);
      try{const st=await sb.from('settings').select('*').eq('key','weekly_mission').maybeSingle();setMi(st.data&&st.data.value?st.data.value:{});}catch(e2){}
      try{const a=await sb.from('activities').select('*').order('date',{ascending:false});setA(a.data||[]);}catch(e3){}
    }catch(e){console.error('Supabase load error:',e);setErr(String(e));}
    setL(false);
  },[]);

  useEffect(function(){load();},[load]);

  const mobStreak=(()=>{const s=[...mobility].filter(x=>x.done!==false).sort((a,b)=>b.date.localeCompare(a.date));let c=0;for(const m of s){c++;/* simple count */}return c;})();
  const totalMin=getTotalMin(stats);
  const cleanSheets=getCleanSheets(stats);

  return{journal,stats,mobility,msgs,mission,activities,loading,err,reload:load,mobStreak,mobBest:mobility.filter(function(x){return x.done!==false}).length,totalMin,cleanSheets};
}

// API
const API={
  async addJournal(e){await sb.from('journal').insert(e);},
  async addStats(r){await sb.from('match_stats').insert(r);},
  async addMobility(d){await sb.from('mobility').upsert({date:d,done:true},{onConflict:'date'});},
  async skipMobility(d){await sb.from('mobility').upsert({date:d,done:false},{onConflict:'date'});},
  async addMsg(m){await sb.from('coach_messages').insert(m);},
  async markRead(id){await sb.from('coach_messages').update({is_read:true}).eq('id',id);},
  async savePrep(t,ids){await sb.from('goals_prep').insert({session_type:t,goal_ids:ids});},
  async getLastPrep(t){const{data}=await sb.from('goals_prep').select('goal_ids').eq('session_type',t).order('created_at',{ascending:false}).limit(1).maybeSingle();return data?.goal_ids||null;},
  async logActivity(d,t){await sb.from('activities').upsert({date:d,type:t,done:true},{onConflict:'date,type'});},
  async isActivityDone(d,t){const{data}=await sb.from('activities').select('done').eq('date',d).eq('type',t).maybeSingle();return data?.done||false;},
};

// PLAYER GOALS / PROGRESSION / PROFILE
// ============================================================
function PGoals({o,d}){
  const gc={};
  d.journal.forEach(j=>(j.goals||[]).forEach(g=>{if(!gc[g.id])gc[g.id]={t:0,g:0,l:[]};gc[g.id].t++;if(g.r==='green'||g.r==='star')gc[g.id].g++;gc[g.id].l.push(g.r);}));
  const ids=[...new Set(d.journal.slice(0,15).flatMap(j=>(j.goals||[]).map(g=>g.id)))];
  const active=ids.map(id=>{const gl=GL.find(g=>g.id===id);if(!gl)return null;const c=gc[id]||{t:0,g:0,l:[]};const r=c.t>0?c.g/c.t:0;const st=r>=0.75?'acquired':r>=0.4?'in-progress':'new';return{...gl,sessions:c.t,history:c.l.slice(-8),status:st,statusLabel:st==='acquired'?'ACQUIS':st==='in-progress'?'EN COURS':'NOUVEAU'};}).filter(Boolean);
  return<div style={{padding:'8px 16px 20px'}}>

// ============================================================
function StatEntry({match,onClose,reload}){
  const name=match?`J${match.n} vs ${match.opp}`:'';
  const [min,setMin]=useState(MATCH_DURATION); // default 70min
  const [cs,setCs]=useState(false);
  const [e,setE]=useState(SC.reduce((a,c)=>({...a,[c.id]:{ok:0,t:0}}),{}));
  const upd=(id,f,delta)=>setE(p=>{const cur=p[id];let next={...cur,[f]:Math.max(0,cur[f]+delta)};if(f==='t'&&next.t<next.ok)next.ok=next.t;if(f==='ok'&&next.ok>next.t)next.t=next.ok;return{...p,[id]:next};});

  const save=async()=>{
    const row={match_name:name,date:match?.date||new Date().toLocaleDateString('fr-BE'),minutes_played:min,clean_sheet:cs};
    SC.forEach(c=>{row[c.id+'_ok']=e[c.id].ok;row[c.id+'_total']=e[c.id].t;});
    await API.addStats(row);reload();onClose();
  };

  return<MS onClose={onClose} title="STATS DU MATCH">
    <div style={{padding:'20px 20px 100px'}}>
      <div className="display" style={{fontSize:24,lineHeight:1}}>
        {match?<>{match.icon||'⚔️'} J{match.n}<br/><span style={{color:T.ac}}>vs {match.opp}</span></>:'SAISIE STATS'}
      </div>
      {match&&<div style={{fontSize:12,color:T.tm,marginTop:8}}>{match.date} · {match.time} · <span style={{color:match.loc==='DOM'?T.gr:T.or,fontWeight:700}}>{match.loc}</span></div>}

      <div style={{height:1,background:T.bs,margin:'20px 0'}}/>

      {/* MINUTES PLAYED */}
      <div className="cd" style={{padding:16,marginBottom:12}}>
        <div className="ey" style={{marginBottom:10}}>⏱ Temps de jeu</div>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <button onClick={()=>setMin(Math.max(0,min-5))} style={{width:44,height:44,borderRadius:10,background:T.bs,border:'none',color:T.text,fontSize:20}}>−</button>
          <div style={{flex:1,textAlign:'center'}}>
            <span className="display" style={{fontSize:36,color:T.ac}}>{min}</span>
            <span style={{fontSize:14,color:T.tm}}> min</span>
          </div>
          <button onClick={()=>setMin(min+5)} style={{width:44,height:44,borderRadius:10,background:T.ac,border:'none',color:'#000',fontSize:20,fontWeight:700}}>+</button>
        </div>
        <div style={{display:'flex',gap:6,marginTop:12}}>
          {[35,50,60,70].map(v=><button key={v} onClick={()=>setMin(v)} style={{flex:1,padding:'8px 0',borderRadius:8,background:min===v?T.ac:T.bs,color:min===v?'#000':T.tm,border:'none',fontSize:12,fontWeight:700}}>{v}'</button>)}
        </div>
        <div style={{fontSize:10,color:T.td,marginTop:8,textAlign:'center'}}>Match complet = 2×35 = 70 min</div>
      </div>

      {/* CLEAN SHEET */}
      <div className="cd" style={{padding:16,marginBottom:12}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div><div className="ey">🛡️ Clean sheet</div><div style={{fontSize:12,color:T.tm,marginTop:4}}>Aucun but encaissé ?</div></div>
          <button onClick={()=>setCs(!cs)} style={{width:56,height:32,borderRadius:16,background:cs?T.ac:T.bs,border:'none',position:'relative',transition:'background 0.2s'}}>
            <div style={{width:24,height:24,borderRadius:12,background:cs?'#000':T.tm,position:'absolute',top:4,left:cs?28:4,transition:'left 0.2s'}}/>
          </button>
        </div>
      </div>

      {/* STATS */}
      {SC.map(c=><div key={c.id} className="cd" style={{padding:16,marginBottom:10}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}><span style={{fontSize:18}}>{c.icon}</span><span className="ds" style={{fontSize:13}}>{c.label}</span></div>
        {['ok','t'].map(f=><div key={f} style={{display:'flex',alignItems:'center',gap:12,marginBottom:8}}>
          <div style={{flex:1,fontSize:12,color:T.tm,fontWeight:600}}>{f==='ok'?'✓ Réussies':'· Tentatives'}</div>
          <button onClick={()=>upd(c.id,f,-1)} style={{width:40,height:40,borderRadius:10,background:T.bs,border:'none',color:T.text,fontSize:20}}>−</button>
          <div style={{minWidth:40,textAlign:'center'}}><span className="display" style={{fontSize:26,color:f==='ok'?T.ac:T.text}}>{e[c.id][f]}</span></div>
          <button onClick={()=>upd(c.id,f,+1)} style={{width:40,height:40,borderRadius:10,background:T.ac,border:'none',color:'#000',fontSize:20,fontWeight:700}}>+</button>
        </div>)}
        {e[c.id].t>=1&&<div style={{fontSize:12,color:T.ac,fontWeight:600,textAlign:'right'}}>= {p100(e[c.id].ok/e[c.id].t)}%</div>}
      </div>)}

      <button onClick={save} className="bp" style={{width:'100%',padding:16,marginTop:20,borderRadius:12,fontSize:14}}>Enregistrer</button>
    </div>
  </MS>;
}

// ============================================================
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
