function getCumul(rows,id){let ok=0,t=0;const pm=[];rows.forEach(r=>{const o2=r[id+'_ok']||0,t2=r[id+'_total']||0;ok+=o2;t+=t2;pm.push({ok:o2,t:t2});});return{ok,total:t,perMatch:pm};}
function getTotalMin(rows){return rows.reduce((a,r)=>a+(r.minutes_played||0),0);}
function getCleanSheets(rows){return rows.filter(r=>r.clean_sheet).length;}

// DATA HOOK
// ============================================================
function useData(){
  const [journal,setJ]=useState([]);
  const [stats,setS]=useState([]);
  const [mobility,setM]=useState([]);
  const [msgs,setC]=useState([]);
  const [mission,setMi]=useState({});
  const [activities,setA]=useState([]);
  const [customGoals,setCG]=useState([]);
  const [loading,setL]=useState(true);
  const [err,setErr]=useState(null);

  const load=useCallback(async()=>{
    try{
      const j=await sb.from('journal').select('*').order('created_at',{ascending:false});
      const s=await sb.from('match_stats').select('*').order('created_at',{ascending:true});
      const m=await sb.from('mobility').select('*').order('date',{ascending:true});
      const c=await sb.from('coach_messages').select('*').order('created_at',{ascending:false});
      setJ(j.data||[]);setS(s.data||[]);setM(m.data||[]);setC(c.data||[]);
      try{const st=await sb.from('settings').select('*').eq('key','weekly_mission').maybeSingle();setMi(st.data&&st.data.value?st.data.value:{});}catch(e2){}
      try{const a=await sb.from('activities').select('*').order('date',{ascending:false});setA(a.data||[]);}catch(e3){}
      try{const cg=await sb.from('custom_goals').select('*').order('created_at',{ascending:false});setCG(cg.data||[]);}catch(e4){}
    }catch(e){console.error('Supabase load error:',e);setErr(String(e));}
    setL(false);
  },[]);

  useEffect(function(){
    load();
    // Real-time: reload when any table changes
    try{
      var ch=sb.channel('realtime-all')
        .on('postgres_changes',{event:'*',schema:'public',table:'journal'},function(){load();})
        .on('postgres_changes',{event:'*',schema:'public',table:'match_stats'},function(){load();})
        .on('postgres_changes',{event:'*',schema:'public',table:'mobility'},function(){load();})
        .on('postgres_changes',{event:'*',schema:'public',table:'coach_messages'},function(){load();})
        .on('postgres_changes',{event:'*',schema:'public',table:'custom_goals'},function(){load();})
        .on('postgres_changes',{event:'*',schema:'public',table:'goals_prep'},function(){load();})
        .subscribe();
    }catch(e5){console.log('Realtime error:',e5);}
    // Fallback: refresh every 30 seconds
    var interval=setInterval(function(){load();},30000);
    return function(){clearInterval(interval);};
  },[load]);

  const mobStreak=(()=>{const s=[...mobility].filter(x=>x.done!==false).sort((a,b)=>b.date.localeCompare(a.date));let c=0;for(const m of s){c++;/* simple count */}return c;})();
  const totalMin=getTotalMin(stats);
  const cleanSheets=getCleanSheets(stats);

  return{journal,stats,mobility,msgs,mission,activities,customGoals,loading,err,reload:load,mobStreak,mobBest:mobility.filter(function(x){return x.done!==false}).length,totalMin,cleanSheets};
}

// API
const API={
  async addJournal(e){await sb.from('journal').insert(e);},
  async addStats(r){await sb.from('match_stats').insert(r);},
  async addMobility(d){await sb.from('mobility').upsert({date:d,done:true},{onConflict:'date'});},
  async skipMobility(d){await sb.from('mobility').upsert({date:d,done:false},{onConflict:'date'});},
  async addMsg(m){await sb.from('coach_messages').insert(m);},
  async markRead(id){await sb.from('coach_messages').update({is_read:true}).eq('id',id);},
  async savePrep(t,ids){await sb.from('goals_prep').insert({session_type:t,goal_ids:ids});},
  async getLastPrep(t){const{data}=await sb.from('goals_prep').select('goal_ids').eq('session_type',t).order('created_at',{ascending:false}).limit(1).maybeSingle();return data?.goal_ids||null;},
  async logActivity(d,t){await sb.from('activities').upsert({date:d,type:t,done:true},{onConflict:'date,type'});},
  async isActivityDone(d,t){const{data}=await sb.from('activities').select('done').eq('date',d).eq('type',t).maybeSingle();return data?.done||false;},
  async addCustomGoal(g){await sb.from('custom_goals').insert(g);},
};

// Merge library goals + custom goals into one list
function allGoals(customGoals){
  var custom = (customGoals||[]).map(function(cg){
    return {id:'custom-'+cg.id, cat:cg.cat, icon:cg.icon||'🎯', phrase:cg.phrase, ctx:cg.ctx||['team','match','gk'], isCustom:true};
  });
  return GL.concat(custom);
}

    {day:4,icon:'💪',label:'CV ACADEMY — RENFORCEMENT',time:'',prep:null,h:20},
    {day:5,icon:'⚡',label:'CV ACADEMY — EXPLOSIVITÉ',time:'',prep:null},
  ];
  var nextSess=null;
  for(var si=0;si<14&&!nextSess;si++){
    var checkDay=(dayNum+si)%7;
    var sessions=schedule.filter(function(s){return s.day===checkDay;});
    for(var sj=0;sj<sessions.length;sj++){
      var sess=sessions[sj];
      if(si===0&&sess.h&&hh>=sess.h) continue;
      if(si===0&&!sess.h&&hh>=20) continue;
      nextSess={...sess,isToday:si===0,isTomorrow:si===1,dayLabel:jours[checkDay]};
      break;
    }
  }
  if(!nextSess) nextSess={icon:'⚽',label:'COLLECTIF',time:'17:45 → 19:00',prep:'tp-team',isToday:false,isTomorrow:true,dayLabel:'LUN'};
  var whenLabel=nextSess.isToday?"AUJOURD'HUI":nextSess.isTomorrow?'DEMAIN '+nextSess.dayLabel:nextSess.dayLabel;

  // Dynamic greeting
  var greet=hh<12?'Bonjour':hh<18?'Bon après-midi':'Bonsoir';

  // Dynamic next match — parse dates and find next upcoming
  function parseDate(dStr){var p=dStr.split('/');return new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));}
  var nextMatch=null;var daysToMatch=0;
  var todayMidnight=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  for(var mi2=0;mi2<SM.length;mi2++){
    var mDate=parseDate(SM[mi2].date);
    var diff=Math.ceil((mDate-todayMidnight)/(1000*60*60*24));
    if(diff>=0){nextMatch=SM[mi2];daysToMatch=diff;break;}
  }

  // If match is today or tomorrow, it becomes the "next session"
  var matchIsNext=nextMatch&&(daysToMatch===0||daysToMatch===1);
  if(matchIsNext){
    var matchWhen=daysToMatch===0?"AUJOURD'HUI":'DEMAIN '+nextMatch.day.toUpperCase();
    nextSess={icon:'⚔️',label:'MATCH vs '+nextMatch.opp.split(' ')[0].toUpperCase(),time:nextMatch.time+' · '+nextMatch.loc,prep:'match-prep',isToday:daysToMatch===0,isTomorrow:daysToMatch===1,dayLabel:nextMatch.day.toUpperCase()};
    whenLabel=matchIsNext&&daysToMatch===0?"AUJOURD'HUI":matchIsNext&&daysToMatch===1?'DEMAIN':'';
  }

  // Headline adapts to context
  var headline1='ON CONTINUE.';
  var headline2='ON BOSSE.';
  if(matchIsNext&&daysToMatch===0){headline1='MATCH DAY.';headline2='C\'EST MAINTENANT.';}
  else if(matchIsNext&&daysToMatch===1){headline1='VEILLE DE MATCH.';headline2='ON SE PRÉPARE.';}
  else if(nextMatch&&daysToMatch<=3){headline1='MATCH DANS '+daysToMatch+'J.';headline2='ON PRÉPARE.';}

  return<div style={{padding:'8px 16px 20px'}}>
    <div style={{padding:'8px 4px 20px'}}>
      <div style={{color:T.tm,fontSize:14,fontWeight:500}}>{greet} Thiago 👋</div>
      <div className="display" style={{fontSize:38,lineHeight:0.95,marginTop:2}}>{headline1}<br/><span style={{color:T.ac}}>{headline2}</span></div>
    </div>

    <div className="cd" style={{padding:20,background:`linear-gradient(135deg,${T.card} 0%,#1C1C20 100%)`,borderColor:T.border}}>
      <div className="ey" style={{color:T.ac,marginBottom:8}}>{matchIsNext?'⚔️ Prochain match':'Prochaine séance'}</div>
      <div className="display" style={{fontSize:26,lineHeight:1}}>{nextSess.icon} {nextSess.label}</div>
      <div style={{color:T.tm,fontSize:13,marginTop:4}}>{whenLabel}{nextSess.time?' · '+nextSess.time:''}</div>
      {nextSess.prep?<button onClick={()=>o(nextSess.prep)} className="bp" style={{width:'100%',padding:16,marginTop:20,borderRadius:12,fontSize:16}}>{matchIsNext?'Préparer mon match →':'Choisir mes objectifs →'}</button>
      :<div style={{padding:'12px 0',marginTop:12,fontSize:13,color:T.tm,textAlign:'center'}}>Pas d'objectifs à choisir — fais ta séance 💪</div>}
    </div>

    {/* MA ROUTINE — visible quand match dans les 2 prochains jours */}
    {nextMatch&&daysToMatch<=2&&<button onClick={()=>o('routine')} className="cd" style={{width:'100%',padding:18,marginTop:12,textAlign:'left',cursor:'pointer',border:`1px solid ${T.ac}`,background:`linear-gradient(135deg,${T.card} 0%,#1A1A20 100%)`,borderRadius:16}}>
      <div style={{display:'flex',alignItems:'center',gap:14}}>
        <div style={{width:48,height:48,borderRadius:12,background:'rgba(212,255,58,0.15)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:24}}>🧠</div>
        <div style={{flex:1}}>
          <div className="display" style={{fontSize:18,color:T.ac}}>MA ROUTINE</div>
          <div style={{fontSize:12,color:T.tm,marginTop:2}}>Routine mentale pré-match</div>
        </div>
        <span style={{fontSize:20,color:T.ac}}>→</span>
      </div>

    {nextMatch&&!matchIsNext&&<div className="cd" style={{padding:18,marginTop:12,borderLeft:`3px solid ${T.ac}`}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div>

          <div className="display" style={{fontSize:20,lineHeight:1}}>vs {nextMatch.opp.split(' ').slice(0,3).join(' ').toUpperCase()}</div>
          <div style={{fontSize:12,color:T.tm,marginTop:6}}>{nextMatch.day.charAt(0).toUpperCase()+nextMatch.day.slice(1)} {nextMatch.date.slice(0,5)} · {nextMatch.time} · <span style={{color:nextMatch.loc==='EXT'?T.or:T.gr,fontWeight:700}}>{nextMatch.loc}</span></div>

    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginTop:12}}>

function RoutineModal({onClose}){
  const [phase,setPhase]=useState(0);
  const [breathActive,setBreathActive]=useState(false);
  const [breathStep,setBreathStep]=useState(0);
  const [breathCount,setBreathCount]=useState(0);
  const [timer,setTimer]=useState(4);
  const [keyword,setKeyword]=useState(null);
  const [done,setDone]=useState({});

  const toggleDone=function(id){setDone(function(p){var n={};for(var k in p)n[k]=p[k];n[id]=!p[id];return n;});};

  // Breathing timer
  useEffect(function(){
    if(!breathActive)return;
    var interval=setInterval(function(){
      setTimer(function(t){
        if(t<=1){
          setBreathStep(function(s){
            var next=(s+1)%4;
            if(next===0)setBreathCount(function(c){return c+1;});
            return next;
          });
          return 4;
        }
        return t-1;
      });
    },1000);
    return function(){clearInterval(interval);};
  },[breathActive]);

  var breathLabels=['INSPIRE','BLOQUE','EXPIRE','BLOQUE'];
  var breathColors=[T.ac,T.go,T.bl,T.go];

  var phases=[
    {id:'car',icon:'🔇',title:'DANS LA VOITURE',subtitle:'30 min avant',items:[
      {id:'music',text:'Mettre ma playlist Match Day'},
      {id:'phone',text:'Téléphone en mode avion'},
      {id:'silence',text:'Me couper du monde extérieur'},
    ]},
    {id:'vestiaire',icon:'🧠',title:'AU VESTIAIRE',subtitle:'20 min avant',items:[
      {id:'equip',text:'M\'habiller dans le même ordre (rituel)'},
      {id:'gloves',text:'Gants en dernier'},
      {id:'breath',text:'Respiration carrée — 5 cycles',isBreathe:true},
      {id:'visu',text:'Visualisation — 1 min yeux fermés, 3 arrêts décisifs'},
      {id:'word',text:'Choisir mon mot-clé du match',isKeyword:true},
    ]},
    {id:'tunnel',icon:'🚶',title:'DANS LE TUNNEL',subtitle:'5 min avant',items:[
      {id:'posture',text:'Posture haute — épaules en arrière, menton relevé'},
      {id:'breath3',text:'3 respirations profondes'},
      {id:'tap',text:'Taper les gants = signal de démarrage'},
      {id:'focus',text:'Écouter, observer — aucune parole inutile'},
    ]},
    {id:'terrain',icon:'⚽',title:'SUR LE TERRAIN',subtitle:'2 min avant le coup d\'envoi',items:[
      {id:'poteaux',text:'Toucher les deux poteaux et la barre — c\'est MON but'},
      {id:'scan',text:'Scanner : tireurs adverses, ailiers rapides'},
      {id:'defense',text:'Placer ma défense — première communication = donner le ton'},
      {id:'last',text:'Inspiration profonde'},
      {id:'phrase',text:'"Premier ballon, je suis là."'},
    ]},
    {id:'reset',icon:'🔄',title:'APRÈS UNE ERREUR',subtitle:'Pendant le match',items:[
      {id:'err-breath',text:'3 secondes — respiration'},
      {id:'err-word',text:'Mon mot-clé de reset : "suivant"'},
      {id:'err-phys',text:'Action physique : taper les gants, toucher le poteau'},
      {id:'err-next',text:'Prochaine action = la SEULE chose qui compte'},
    ]},
  ];

  var currentPhase=phases[phase];
  var allChecked=currentPhase.items.every(function(it){return done[it.id];});
  var keywords=['MUR','PRÉSENT','VOCAL','DOMINANT','SOLIDE','CONFIANT','FOCUS','PATRON'];

  return<MS onClose={onClose} title="🧠 MA ROUTINE">
    <div style={{padding:'0 0 100px'}}>
      {/* Phase tabs */}
      <div style={{display:'flex',overflowX:'auto',gap:4,padding:'12px 16px',borderBottom:'1px solid '+T.bs}}>
        {phases.map(function(p,i){
          var active=i===phase;
          var isDone=p.items.every(function(it){return done[it.id];});
          return<button key={p.id} onClick={function(){setPhase(i);}} style={{flexShrink:0,padding:'8px 14px',borderRadius:10,border:'none',background:active?T.ac:isDone?'rgba(34,197,94,0.15)':T.card,color:active?'#000':isDone?T.gr:T.tm,fontSize:11,fontWeight:700,letterSpacing:'0.05em',whiteSpace:'nowrap'}}>{p.icon} {p.title.split(' ').slice(-1)[0]}</button>;
        })}
      </div>

      <div style={{padding:'24px 20px'}}>
        {/* Phase header */}
        <div style={{textAlign:'center',marginBottom:24}}>
          <div style={{fontSize:48,marginBottom:8}}>{currentPhase.icon}</div>
          <div className="display" style={{fontSize:28,lineHeight:1}}>{currentPhase.title}</div>
          <div style={{fontSize:13,color:T.tm,marginTop:6}}>{currentPhase.subtitle}</div>
        </div>

        {/* Items */}
        {currentPhase.items.map(function(it){
          var checked=done[it.id];
          return<div key={it.id} style={{marginBottom:8}}>
            <button onClick={function(){if(!it.isBreathe&&!it.isKeyword)toggleDone(it.id);}} style={{width:'100%',padding:16,textAlign:'left',background:checked?'rgba(212,255,58,0.08)':T.card,border:checked?'2px solid '+T.ac:'1px solid '+T.bs,borderRadius:14,display:'flex',alignItems:'center',gap:14,color:T.text}}>
              <div style={{width:28,height:28,borderRadius:8,border:checked?'none':'2px solid '+T.border,background:checked?T.ac:'transparent',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,color:'#000',flexShrink:0}}>{checked?'✓':''}</div>
              <div style={{flex:1,fontSize:14,lineHeight:1.4,color:checked?T.ac:T.text,fontWeight:500}}>{it.text}</div>
            </button>

            {/* Breathing exercise inline */}
            {it.isBreathe&&!checked&&<div className="cd" style={{padding:20,marginTop:8,textAlign:'center'}}>
              {!breathActive?
                <button onClick={function(){setBreathActive(true);setBreathStep(0);setBreathCount(0);setTimer(4);}} className="bp" style={{padding:'14px 28px',borderRadius:12,fontSize:14}}>Démarrer la respiration</button>
              :<div>
                <div className="display" style={{fontSize:56,color:breathColors[breathStep],lineHeight:1,marginBottom:8}}>{timer}</div>
                <div className="display" style={{fontSize:22,color:breathColors[breathStep]}}>{breathLabels[breathStep]}</div>
                <div style={{marginTop:16,display:'flex',justifyContent:'center',gap:6}}>
                  {[0,1,2,3,4].map(function(i){return<div key={i} style={{width:12,height:12,borderRadius:6,background:i<breathCount?T.ac:T.bs}}/>;})}
                </div>
                <div style={{fontSize:12,color:T.tm,marginTop:8}}>{breathCount}/5 cycles</div>
                {breathCount>=5&&<div style={{marginTop:12}}>
                  <div style={{fontSize:14,color:T.ac,fontWeight:700,marginBottom:8}}>✓ 5 cycles terminés</div>
                  <button onClick={function(){setBreathActive(false);toggleDone(it.id);}} className="bp" style={{padding:'10px 20px',borderRadius:10,fontSize:13}}>Continuer</button>
                </div>}
              </div>}
            </div>}

            {/* Keyword selector inline */}
            {it.isKeyword&&!checked&&<div className="cd" style={{padding:16,marginTop:8}}>
              <div style={{fontSize:12,color:T.tm,marginBottom:10}}>Choisis ton mot pour ce match :</div>
              <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                {keywords.map(function(w){return<button key={w} onClick={function(){setKeyword(w);toggleDone(it.id);}} style={{padding:'10px 16px',borderRadius:10,background:keyword===w?T.ac:T.card,color:keyword===w?'#000':T.text,border:keyword===w?'none':'1px solid '+T.bs,fontSize:13,fontWeight:700,letterSpacing:'0.05em'}}>{w}</button>;})}
              </div>
            </div>}
          </div>;
        })}

        {/* Next phase button */}
        {phase<phases.length-1?
          <button onClick={function(){setPhase(phase+1);}} disabled={!allChecked} className="bp" style={{width:'100%',padding:16,marginTop:24,borderRadius:14,fontSize:15,opacity:allChecked?1:0.4}}>
            Phase suivante →
          </button>
        :allChecked?
          <div style={{textAlign:'center',marginTop:24}}>
            <div style={{fontSize:48,marginBottom:10}}>🧤</div>
            <div className="display" style={{fontSize:24,color:T.ac}}>TU ES PRÊT.</div>
            {keyword&&<div style={{fontSize:16,color:T.tm,marginTop:8}}>Ton mot : <span className="display" style={{fontSize:22,color:T.ac}}>{keyword}</span></div>}
            <button onClick={onClose} className="bp" style={{padding:'16px 32px',borderRadius:14,fontSize:16,marginTop:20}}>ALLONS-Y 🧤</button>
          </div>
        :null}
      </div>
    </div>
  </MS>;
}

function GoalWiz({onClose,reload}){
  const [step,setStep]=useState(0);const [a,setA]=useState({});const [saving,setSaving]=useState(false);
  const catIcons={'TECHNIQUE':'🧤','TACTIQUE':'🧠','MENTAL':'🧠','PHYSIQUE':'💪','COMMUNICATION':'🗣️'};
  const ctxMap={'Match':['match'],'Équipe':['team'],'Gardien':['gk']};
  const steps=[{n:'01',l:'QUOI ?',q:'Que veux-tu améliorer ?',opts:['TECHNIQUE','TACTIQUE','MENTAL','PHYSIQUE','COMMUNICATION']},{n:'02',l:'OÙ ?',q:'Dans quelle situation ?',opts:['Match','Équipe','Gardien']},{n:'03',l:'COMMENT ?',q:'Quel comportement ?',opts:['Plus tôt','Plus précis','Plus haut','Décision rapide','Meilleure lecture']},{n:'04',l:'POURQUOI ?',q:'Pourquoi ?',opts:['Aider ma défense','Progresser','Franchir un cap','Confirmer']}];

  const saveGoal=async()=>{
    setSaving(true);
    var phrase='En '+((a[1]||'').toLowerCase())+', être '+((a[2]||'').toLowerCase())+' sur mon '+((a[0]||'').toLowerCase())+', pour '+((a[3]||'').toLowerCase())+'.';
    var ctx=ctxMap[a[1]]||['team','match','gk'];
    await API.addCustomGoal({cat:a[0]||'AUTRE',icon:catIcons[a[0]]||'🎯',phrase:phrase,ctx:ctx,created_by:'parent'});
    if(reload) reload();
    onClose();
  };

  if(step===4)return<MS onClose={onClose} title="OBJECTIF CRÉÉ"><div style={{padding:30,textAlign:'center'}}><div style={{fontSize:56,marginBottom:14}}>🎯</div><div className="display" style={{fontSize:22}}>OBJECTIF <span style={{color:T.ac}}>CRÉÉ</span></div><div className="cd" style={{padding:20,marginTop:24,textAlign:'left'}}><div style={{fontSize:15,lineHeight:1.4,fontWeight:500,color:T.text}}>"En {(a[1]||'').toLowerCase()}, être <span style={{color:T.ac}}>{(a[2]||'').toLowerCase()}</span> sur mon <span style={{color:T.ac}}>{(a[0]||'').toLowerCase()}</span>, pour <span style={{color:T.ac}}>{(a[3]||'').toLowerCase()}</span>."</div></div><button onClick={saveGoal} disabled={saving} className="bp" style={{width:'100%',padding:16,marginTop:24,borderRadius:12,fontSize:15,opacity:saving?0.5:1}}>{saving?'Enregistrement...':'Ajouter aux objectifs'}</button></div></MS>;
  const cur=steps[step];
  return<MS onClose={onClose} title={`ÉTAPE ${step+1}/4`}><div style={{padding:'30px 20px 100px'}}>
    <div style={{display:'flex',gap:6,marginBottom:30}}>{steps.map((_,i)=><div key={i} style={{flex:1,height:4,borderRadius:2,background:i<=step?T.ac:T.bs}}/>)}</div>
    <div className="display" style={{fontSize:80,color:T.ac,lineHeight:0.9,marginBottom:10}}>{cur.n}</div>
    <div className="display" style={{fontSize:36,lineHeight:0.95}}>{cur.l}</div>
    <div style={{fontSize:15,color:T.tm,marginTop:12}}>{cur.q}</div>
    <div style={{marginTop:30}}>{cur.opts.map(opt=><button key={opt} onClick={()=>{setA({...a,[step]:opt});setTimeout(()=>setStep(step+1),200);}} style={{display:'block',width:'100%',padding:'18px 20px',marginBottom:8,textAlign:'left',fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,fontSize:20,background:a[step]===opt?T.ac:T.card,color:a[step]===opt?'#000':T.text,border:'none',borderRadius:12}}>{opt}</button>)}</div>
    {step>0&&<button onClick={()=>setStep(step-1)} className="bg" style={{padding:'10px 16px',marginTop:16,borderRadius:10,fontSize:12}}>← Retour</button>}
  </div></MS>;
}

function PGoals({o,d}){
  const gc={};
  d.journal.forEach(j=>(j.goals||[]).forEach(g=>{if(!gc[g.id])gc[g.id]={t:0,g:0,l:[]};gc[g.id].t++;if(g.r==='green'||g.r==='star')gc[g.id].g++;gc[g.id].l.push(g.r);}));
  const ids=[...new Set(d.journal.slice(0,15).flatMap(j=>(j.goals||[]).map(g=>g.id)))];
  const active=ids.map(id=>{const AG3=allGoals(d.customGoals);const gl=AG3.find(g=>g.id===id);if(!gl)return null;const c=gc[id]||{t:0,g:0,l:[]};const r=c.t>0?c.g/c.t:0;const st=r>=0.75?'acquired':r>=0.4?'in-progress':'new';return{...gl,sessions:c.t,history:c.l.slice(-8),status:st,statusLabel:st==='acquired'?'ACQUIS':st==='in-progress'?'EN COURS':'NOUVEAU'};}).filter(Boolean);
  // Also show custom goals not yet used in any session
  const usedIds = new Set(active.map(function(g){return g.id;}));
  const unusedCustom = (d.customGoals||[]).filter(function(cg){return !usedIds.has('custom-'+cg.id);}).map(function(cg){
    return {id:'custom-'+cg.id, cat:cg.cat, icon:cg.icon||'🎯', phrase:cg.phrase, sessions:0, history:[], status:'new', statusLabel:'NOUVEAU', isCustom:true};
  });

  return<div style={{padding:'8px 16px 20px'}}>
    <div className="display" style={{fontSize:32,padding:'8px 4px 20px'}}>CE QUE JE <span style={{color:T.ac}}>TRAVAILLE.</span></div>
    {active.filter(g=>g.status!=='acquired').map(g=><GCard key={g.id} goal={g} onClick={()=>o({type:'goal-detail',goal:g})}/>)}
    {unusedCustom.map(g=><GCard key={g.id} goal={g} onClick={()=>o({type:'goal-detail',goal:g})}/>)}
    {active.filter(g=>g.status==='acquired').length>0&&<><div className="ey" style={{marginTop:24,marginBottom:10}}>Acquis</div>{active.filter(g=>g.status==='acquired').map(g=><div key={g.id} className="cd" style={{padding:14,marginBottom:8,opacity:0.75}}><div style={{display:'flex',alignItems:'center',gap:10}}><span>{g.icon}</span><span className="ds" style={{fontSize:13,color:T.tm}}>{g.cat}</span><span style={{marginLeft:'auto',fontSize:10,color:T.gr,fontWeight:700}}>⭐</span></div><div style={{fontSize:13,marginTop:6,color:T.text}}>"{g.phrase}"</div></div>)}</>}
    <button onClick={()=>o('goal-wiz')} className="bg" style={{width:'100%',padding:14,marginTop:20,borderRadius:12,fontSize:13}}>+ Créer un objectif</button>
  </div>;
}

function ParOv({o,d}){
  // Dynamic next match
  var now2=new Date();
  var todayM=new Date(now2.getFullYear(),now2.getMonth(),now2.getDate());
  function parseD(s){var p=s.split('/');return new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));}
  var nm=null;var dtm=0;
  for(var i=0;i<SM.length;i++){var md=parseD(SM[i].date);var diff=Math.ceil((md-todayM)/(1000*60*60*24));if(diff>=0){nm=SM[i];dtm=diff;break;}}

  var matchLabel=dtm===0?"AUJOURD'HUI":dtm===1?'DEMAIN':'J-'+dtm;

  return<div style={{padding:'8px 16px 20px'}}>
    <div className="ey" style={{padding:'8px 4px'}}>Vue parent · Thiago</div>

    {nm&&<div className="cd" style={{padding:18,marginBottom:12,borderLeft:`3px solid ${T.ac}`}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>

        <div className="display" style={{fontSize:36,color:T.ac}}>{matchLabel}</div>
      </div>
    </div>}

    {nm&&dtm<=2&&<div className="cd" style={{padding:18,marginBottom:12,background:`linear-gradient(135deg,${T.card} 0%,#1E1E22 100%)`,borderColor:T.ac}}>
      <div className="ey" style={{color:T.ac,marginBottom:10}}>🚗 Après J{nm.n}</div>
      {['Communication : tu as parlé AVANT les situations chaudes ?','Quelle intervention te reste en tête ?','Quoi travailler au prochain entraînement gardien ?'].map((q,i)=><div key={i} style={{padding:'10px 0',borderTop:i>0?`1px solid ${T.bs}`:'none',fontSize:13,lineHeight:1.4,color:T.text}}><span style={{color:T.ac,fontWeight:700,marginRight:8}}>{i+1}.</span>{q}</div>)}
    </div>}

    <div className="cd" style={{padding:18,marginBottom:12}}>
      <div className="ey" style={{marginBottom:12}}>Statut Thiago</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <div><div className="display" style={{fontSize:26,color:T.ac}}>{d.mobStreak}j</div><div className="ey">Mobilité</div></div>
        <div><div className="display" style={{fontSize:26,color:T.text}}>{d.journal.length}</div><div className="ey">Débriefs</div></div>
        <div><div className="display" style={{fontSize:26,color:T.text}}>{d.totalMin}'</div><div className="ey">Minutes jouées</div></div>
        <div><div className="display" style={{fontSize:26,color:T.go}}>{d.cleanSheets}</div><div className="ey">Clean sheets</div></div>
      </div>
    </div>

    {/* Fix: visible text on dark background */}

// PARENT GOALS — see all of Thiago's goals
// ============================================================
function ParGoals({o,d}){
  var AG=allGoals(d.customGoals);
  // Build goal status from journal
  var gc={};
  d.journal.forEach(function(j){(j.goals||[]).forEach(function(g){if(!gc[g.id])gc[g.id]={t:0,good:0,l:[]};gc[g.id].t++;if(g.r==='green'||g.r==='star')gc[g.id].good++;gc[g.id].l.push(g.r);});});

  // Active goals from journal
  var ids=[...new Set(d.journal.slice(0,15).flatMap(function(j){return (j.goals||[]).map(function(g){return g.id;});}))];
  var active=ids.map(function(id){var gl=AG.find(function(g){return g.id===id;});if(!gl)return null;var c=gc[id]||{t:0,good:0,l:[]};var ratio=c.t>0?c.good/c.t:0;var status=ratio>=0.75?'acquired':ratio>=0.4?'in-progress':'new';return Object.assign({},gl,{sessions:c.t,history:c.l.slice(-8),status:status,statusLabel:status==='acquired'?'ACQUIS':status==='in-progress'?'EN COURS':'NOUVEAU'});}).filter(Boolean);

  // Custom goals not yet used
  var usedIds=new Set(active.map(function(g){return g.id;}));
  var unusedCustom=(d.customGoals||[]).filter(function(cg){return !usedIds.has('custom-'+cg.id);}).map(function(cg){return {id:'custom-'+cg.id,cat:cg.cat,icon:cg.icon||'🎯',phrase:cg.phrase,sessions:0,history:[],status:'new',statusLabel:'NOUVEAU'};});

  // Last selected goals for next session
  var allItems=active.concat(unusedCustom);

  return<div style={{padding:'8px 16px 20px'}}>
    <div className="ey" style={{padding:'8px 4px'}}>Objectifs de Thiago</div>
    <div className="display" style={{fontSize:30,padding:'0 4px 20px'}}>SES <span style={{color:T.ac}}>OBJECTIFS.</span></div>

    {allItems.length===0&&<div className="cd" style={{padding:24,textAlign:'center',marginBottom:12}}>
      <div style={{fontSize:36,marginBottom:10}}>🎯</div>
      <div style={{fontSize:14,color:T.tm,lineHeight:1.5}}>Aucun objectif encore.<br/>Crée-en un ou attends que Thiago en choisisse.</div>
    </div>}

    {allItems.filter(function(g){return g.status!=='acquired';}).map(function(g){return<div key={g.id} className="cd" style={{padding:16,marginBottom:8}}>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}><span style={{fontSize:18}}>{g.icon}</span><span className="ds" style={{fontSize:13,color:T.tm}}>{g.cat}</span></div>
        <span style={{fontSize:9,color:g.status==='new'?T.bl:T.or,fontWeight:800,padding:'3px 8px',border:'1px solid '+(g.status==='new'?T.bl:T.or),borderRadius:4}}>{g.statusLabel}</span>
      </div>
      <div style={{fontSize:14,marginBottom:8,lineHeight:1.4,color:T.text}}>"{g.phrase}"</div>
      {g.history.length>0&&<div style={{display:'flex',gap:4}}>{g.history.map(function(r,i){return<div key={i} style={{width:14,height:14,borderRadius:3,background:(RM[r]||{}).c||T.bs}}/>;})}</div>}
      {g.sessions>0&&<div style={{fontSize:11,color:T.tm,marginTop:6}}>{g.sessions} séance{g.sessions>1?'s':''} travaillée{g.sessions>1?'s':''}</div>}
    </div>;})}

    {allItems.filter(function(g){return g.status==='acquired';}).length>0&&<>
      <div className="ey" style={{marginTop:24,marginBottom:10}}>Acquis</div>
      {allItems.filter(function(g){return g.status==='acquired';}).map(function(g){return<div key={g.id} className="cd" style={{padding:14,marginBottom:8,opacity:0.75}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}><span>{g.icon}</span><span className="ds" style={{fontSize:13,color:T.tm}}>{g.cat}</span><span style={{marginLeft:'auto',fontSize:10,color:T.gr,fontWeight:700}}>⭐ ACQUIS</span></div>
        <div style={{fontSize:13,marginTop:6,color:T.text}}>"{g.phrase}"</div>
      </div>;})}
    </>}

    <button onClick={function(){return o('goal-wiz');}} className="bp" style={{width:'100%',padding:14,marginTop:20,borderRadius:12,fontSize:13}}>+ Proposer un objectif</button>
  </div>;
}

// ============================================================
// STAT ENTRY — with minutes played + clean sheet
// ============================================================
function StatEntry({match,onClose,reload}){
  const name=match?`J${match.n} vs ${match.opp}`:'';
  const [min,setMin]=useState(MATCH_DURATION); // default 70min
  const [cs,setCs]=useState(false);
  const [e,setE]=useState(SC.reduce((a,c)=>({...a,[c.id]:{ok:0,t:0}}),{}));
  const upd=(id,f,delta)=>setE(p=>{const cur=p[id];let next={...cur,[f]:Math.max(0,cur[f]+delta)};if(f==='t'&&next.t<next.ok)next.ok=next.t;if(f==='ok'&&next.ok>next.t)next.t=next.ok;return{...p,[id]:next};});

  const save=async()=>{
    const row={match_name:name,date:match?.date||new Date().toLocaleDateString('fr-BE'),minutes_played:min,clean_sheet:cs};
    SC.forEach(c=>{row[c.id+'_ok']=e[c.id].ok;row[c.id+'_total']=e[c.id].t;});
    await API.addStats(row);reload();onClose();
  };

  return<MS onClose={onClose} title="STATS DU MATCH">
    <div style={{padding:'20px 20px 100px'}}>
      <div className="display" style={{fontSize:24,lineHeight:1}}>
        {match?<>{match.icon||'⚔️'} J{match.n}<br/><span style={{color:T.ac}}>vs {match.opp}</span></>:'SAISIE STATS'}
      </div>
      {match&&<div style={{fontSize:12,color:T.tm,marginTop:8}}>{match.date} · {match.time} · <span style={{color:match.loc==='DOM'?T.gr:T.or,fontWeight:700}}>{match.loc}</span></div>}

      <div style={{height:1,background:T.bs,margin:'20px 0'}}/>

      {/* MINUTES PLAYED */}
      <div className="cd" style={{padding:16,marginBottom:12}}>
        <div className="ey" style={{marginBottom:10}}>⏱ Temps de jeu</div>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <button onClick={()=>setMin(Math.max(0,min-5))} style={{width:44,height:44,borderRadius:10,background:T.bs,border:'none',color:T.text,fontSize:20}}>−</button>
          <div style={{flex:1,textAlign:'center'}}>
            <span className="display" style={{fontSize:36,color:T.ac}}>{min}</span>
            <span style={{fontSize:14,color:T.tm}}> min</span>
          </div>
          <button onClick={()=>setMin(min+5)} style={{width:44,height:44,borderRadius:10,background:T.ac,border:'none',color:'#000',fontSize:20,fontWeight:700}}>+</button>
        </div>
        <div style={{display:'flex',gap:6,marginTop:12}}>
          {[35,50,60,70].map(v=><button key={v} onClick={()=>setMin(v)} style={{flex:1,padding:'8px 0',borderRadius:8,background:min===v?T.ac:T.bs,color:min===v?'#000':T.tm,border:'none',fontSize:12,fontWeight:700}}>{v}'</button>)}
        </div>
        <div style={{fontSize:10,color:T.td,marginTop:8,textAlign:'center'}}>Match complet = 2×35 = 70 min</div>
      </div>

      {/* CLEAN SHEET */}
      <div className="cd" style={{padding:16,marginBottom:12}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div><div className="ey">🛡️ Clean sheet</div><div style={{fontSize:12,color:T.tm,marginTop:4}}>Aucun but encaissé ?</div></div>
          <button onClick={()=>setCs(!cs)} style={{width:56,height:32,borderRadius:16,background:cs?T.ac:T.bs,border:'none',position:'relative',transition:'background 0.2s'}}>
            <div style={{width:24,height:24,borderRadius:12,background:cs?'#000':T.tm,position:'absolute',top:4,left:cs?28:4,transition:'left 0.2s'}}/>
          </button>
        </div>
      </div>

      {/* STATS */}
      {SC.map(c=><div key={c.id} className="cd" style={{padding:16,marginBottom:10}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}><span style={{fontSize:18}}>{c.icon}</span><span className="ds" style={{fontSize:13}}>{c.label}</span></div>
        {['ok','t'].map(f=><div key={f} style={{display:'flex',alignItems:'center',gap:12,marginBottom:8}}>
          <div style={{flex:1,fontSize:12,color:T.tm,fontWeight:600}}>{f==='ok'?'✓ Réussies':'· Tentatives'}</div>
          <button onClick={()=>upd(c.id,f,-1)} style={{width:40,height:40,borderRadius:10,background:T.bs,border:'none',color:T.text,fontSize:20}}>−</button>
          <div style={{minWidth:40,textAlign:'center'}}><span className="display" style={{fontSize:26,color:f==='ok'?T.ac:T.text}}>{e[c.id][f]}</span></div>
          <button onClick={()=>upd(c.id,f,+1)} style={{width:40,height:40,borderRadius:10,background:T.ac,border:'none',color:'#000',fontSize:20,fontWeight:700}}>+</button>
        </div>)}
        {e[c.id].t>=1&&<div style={{fontSize:12,color:T.ac,fontWeight:600,textAlign:'right'}}>= {p100(e[c.id].ok/e[c.id].t)}%</div>}
      </div>)}

      <button onClick={save} className="bp" style={{width:'100%',padding:16,marginTop:20,borderRadius:12,fontSize:14}}>Enregistrer</button>
    </div>
  </MS>;
}

// ============================================================
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
